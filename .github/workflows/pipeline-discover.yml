name: Daily sentiment discovery

on:
  schedule:
    # 06:30 UTC every day
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pipeline discover
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$PIPELINE_SECRET" ]; then
            echo "PIPELINE_SECRET secret is not set — skipping."
            exit 0
          fi
          BASE_URL="${SITE_URL:-https://segno.app}"
          curl -fsS -X POST "$BASE_URL/api/pipeline/discover" \
            -H "Authorization: Bearer $PIPELINE_SECRET" \
            -H "Content-Type: application/json"
